name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Cross-compile libcalc.so (arm64)
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a build -p calc-ffi --release --locked

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;${NDK_VERSION}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + unit test
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
