name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;${NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Build signed APK + AAB
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Stage artifacts
        run: |
          mkdir -p dist
          v="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/*.apk "dist/calcplus-${v}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "dist/calcplus-${v}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/calcplus-*.apk
            dist/calcplus-*.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
