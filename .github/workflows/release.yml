name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag / version
        id: rel
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag must start with 'v' (got '$TAG')"; exit 1;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;${NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # tolerate whitespace/newlines in the secret; -w0 not required upstream
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
          size=$(stat -c%s "$RUNNER_TEMP/upload.jks")
          echo "keystore is $size bytes"
          if [ "$size" -lt 500 ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 decoded to $size bytes — the secret is empty or truncated."
            exit 1
          fi
          # fail early (with a clear message) if the keystore or password is wrong
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null \
            || { echo "::error::Could not read alias '$KEY_ALIAS' from the keystore — check SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS."; exit 1; }
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Build signed APK + AAB
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Stage artifacts
        run: |
          mkdir -p dist
          v="${{ steps.rel.outputs.version }}"
          cp android/app/build/outputs/apk/release/*.apk "dist/calcplus-${v}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "dist/calcplus-${v}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: |
            dist/calcplus-*.apk
            dist/calcplus-*.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
